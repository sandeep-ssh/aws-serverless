<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>University Student Registry</title>
  <meta name="description" content="A clean, accessible student registry UI by Sandeep Hegde." />

  <!-- Open Graph -->
  <meta property="og:title" content="University Student Registry" />
  <meta property="og:description" content="A clean, accessible student registry UI by Sandeep Hegde." />

  <!-- PWA / Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/frontend.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <!-- Skip Navigation -->
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header -->
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <div class="brand">
        <h1 class="logo">University Student Registry/h1>
        <p class="tag">University Student Registry · Created by Sandeep Hegde</p>
      </div>

      <nav class="site-nav" role="navigation" aria-label="Main navigation">
        <button
          id="themeToggle"
          class="btn icon-btn"
          type="button"
          aria-label="Toggle dark mode"
        >
          🌓
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main" class="container" role="main">

    <!-- Add Student Form -->
    <section class="card" aria-labelledby="formTitle">
      <header class="card-header">
        <h2 id="formTitle">Add Student</h2>
      </header>

      <form id="studentForm" class="form" autocomplete="on" novalidate>
        <div class="form-group">
          <label for="studentName">Student Name</label>
          <input
            id="studentName"
            name="studentName"
            type="text"
            required
            aria-required="true"
          />
        </div>

        <div class="form-group">
          <label for="rollNumber">Roll Number</label>
          <input
            id="rollNumber"
            name="rollNumber"
            type="text"
            inputmode="numeric"
            required
            aria-required="true"
          />
        </div>

        <div class="form-group">
          <label for="class">Class</label>
          <select
            id="class"
            name="class"
            required
            aria-required="true"
          >
            <option value="" disabled selected>Select class</option>
            <option>Class 1</option>
            <option>Class 2</option>
            <option>Class 3</option>
            <option>Class 4</option>
            <option>Class 5</option>
            <option>Class 6</option>
            <option>Class 7</option>
            <option>Class 8</option>
            <option>Class 9</option>
            <option>Class 10</option>
            <option>Class 11</option>
            <option>Class 12</option>
            <option>Bachelor's (College)</option>
            <option>Master's (College)</option>
            <option>Others</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn primary">Add Student</button>
          <button type="reset" class="btn secondary">Reset</button>
        </div>
      </form>
    </section>

    <!-- Students Table -->
    <section class="card" aria-labelledby="tableTitle">
      <header class="card-header">
        <h2 id="tableTitle">Students</h2>
      </header>

      <div class="table-wrap">
        <table class="students-table" aria-describedby="tableTitle">
          <thead>
            <tr>
              <th scope="col">Roll</th>
              <th scope="col">Name</th>
              <th scope="col">Class</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- Rows populated by JavaScript -->
          </tbody>
        </table>

        <!-- Loading Skeleton -->
        <div
          id="loadingIndicator"
          class="skeleton"
          aria-hidden="true"
        ></div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <p>© <span id="year"></span> Sandeep Hegde</p>

      <nav class="socials" aria-label="Social links">
        <a
          href="https://github.com/sandeep-ssh"
          target="_blank"
          rel="noopener"
        >
          GitHub
        </a>
      </nav>
    </div>
  </footer>

  <!-- Accessible Modal -->
  <div
    id="customModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
  >
    <div class="modal-overlay" onclick="closeModal()"></div>

    <div class="modal-content">
      <button
        class="modal-close"
        aria-label="Close"
        onclick="closeModal()"
      >
        &times;
      </button>

      <div class="modal-body">
        <p class="modal-message">⚠️ Please fill out all fields.</p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/app.js" defer></script>
</body>
</html>
